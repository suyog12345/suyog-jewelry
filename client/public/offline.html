<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | Suyog Jewelry</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #FDFBF7;
      color: #1A1A1A;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #FFFFFF;
      max-width: 480px;
      width: 100%;
      border-radius: 16px;
      padding: 40px 28px;
      box-shadow: 0 10px 30px rgba(74, 8, 23, 0.08);
      border: 1px solid #EFE8DA;
    }
    .emblem {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: radial-gradient(circle, #7B1930 0%, #4A0817 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #D4AF37;
      box-shadow: 0 4px 15px rgba(123, 25, 48, 0.25);
    }
    .brand {
      font-size: 24px;
      font-weight: 700;
      color: #4A0817;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .divider {
      width: 48px;
      height: 2px;
      background: #D4AF37;
      margin: 0 auto 20px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      color: #1A1A1A;
      margin-bottom: 12px;
    }
    p {
      color: #666666;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn-retry {
      background: linear-gradient(135deg, #7B1930 0%, #4A0817 100%);
      color: #FFFFFF;
      border: 1px solid #D4AF37;
      border-radius: 8px;
      padding: 12px 28px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(74, 8, 23, 0.2);
    }
    .btn-retry:hover {
      background: linear-gradient(135deg, #911F3A 0%, #5B0C1E 100%);
      transform: translateY(-1px);
    }
    .contact-box {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid #EFE8DA;
      font-size: 13px;
      color: #888888;
    }
    .contact-box strong {
      color: #4A0817;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="emblem">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#D4AF37" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 1l22 22"></path>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <div class="brand">Suyog Jewelry</div>
    <div class="divider"></div>
    <h1>You're Currently Offline</h1>
    <p>We're unable to connect to the network right now. Please check your internet connection and try again to view our handcrafted jewelry collections.</p>
    <button class="btn-retry" onclick="checkAndReload()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"></polyline>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
      </svg>
      Try Again
    </button>
    <div class="contact-box">
      For urgent enquiries, visit our boutique in Mumbai or call us directly.
    </div>
  </div>

  <script>
    function checkAndReload() {
      if (navigator.onLine) {
        window.location.reload();
      } else {
        alert('Still offline. Please reconnect your Wi-Fi or mobile data.');
      }
    }
    window.addEventListener('online', function() {
      window.location.reload();
    });
  </script>
</body>
</html>
